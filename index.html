<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2BC45F">
<title>note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>


:root{
  --ground:#EDF1EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --surface-3:#E4EBE6;
  --ink:#16201C; --ink-2:#47544F; --ink-3:#77857F; --line:#D8DFDC; --line-2:#C2CCC7;
  --accent:#2BC45F; --accent-hover:#22B052; --accent-soft:#DDF7E5; --accent-ink:#157A38; --on-accent:#05290F;
  --mark:#C98A12; --mark-soft:#FAEFD6; --mark-ink:#7A5206;
  --ok:#1D7A4C; --ok-soft:#DDF1E6; --danger:#B42E22; --danger-soft:#F8E1DE;
  --frame:#1B2320; --scrim:rgba(10,18,15,.44);
  --shadow:0 1px 2px rgba(20,32,28,.06),0 10px 28px rgba(20,32,28,.10);
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1412; --surface:#171D1B; --surface-2:#1D2522; --surface-3:#26302C;
    --ink:#E3EAE7; --ink-2:#A8B5B0; --ink-3:#76847E; --line:#2A3430; --line-2:#37433E;
    --accent:#4ADE80; --accent-hover:#6EE79A; --accent-soft:#14331F; --accent-ink:#8CEBAE; --on-accent:#052E16;
    --mark:#E5AE45; --mark-soft:#3A2D12; --mark-ink:#F2CD85;
    --ok:#5CCB93; --ok-soft:#153A28; --danger:#F08A7E; --danger-soft:#3E1D19;
    --frame:#000000; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1412; --surface:#171D1B; --surface-2:#1D2522; --surface-3:#26302C;
  --ink:#E3EAE7; --ink-2:#A8B5B0; --ink-3:#76847E; --line:#2A3430; --line-2:#37433E;
  --accent:#4ADE80; --accent-hover:#6EE79A; --accent-soft:#14331F; --accent-ink:#8CEBAE; --on-accent:#052E16;
  --mark:#E5AE45; --mark-soft:#3A2D12; --mark-ink:#F2CD85;
  --ok:#5CCB93; --ok-soft:#153A28; --danger:#F08A7E; --danger-soft:#3E1D19;
  --frame:#000000; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
code{font:12px var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:4px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── 무대 ── */
.app{position:relative;height:100vh;height:100dvh;background:var(--ground);overflow:hidden;container:app / inline-size}
#view{height:100%}

/* ── 셸 ── */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;gap:2px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,#7BEA9C 0%,#34CF68 55%,#1FA84F 100%);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--sans);letter-spacing:-.01em;text-shadow:0 1px 1px rgba(0,60,20,.35);flex:none}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);background:none;border:0;cursor:pointer;font-weight:500;text-align:left;width:100%}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side .me .who{min-width:0;flex:1}
.side .me .who b{display:block;font-size:13px}
.side .me .who span{font-size:11.5px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.main{overflow:auto;min-width:0;min-height:0;position:relative;scroll-behavior:smooth}
.mtop{display:none}
.tabbar{display:none}

/* ── 페이지 ── */
.page{padding:26px 32px 48px;max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.ph h1{margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.ph .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.ph .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--ink-3);font-size:13px;cursor:pointer;background:none;border:0;padding:0;margin:0 0 6px -4px}
.back svg.i{width:16px;height:16px}
.back:hover{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg.i{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-3);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line-2))}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:var(--mark-soft);color:var(--mark-ink)}
.pill.sent{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--surface-3);color:var(--ink-3)}
.pill.none{background:var(--danger-soft);color:var(--danger)}
.pill.role{background:var(--accent-soft);color:var(--accent-ink)}
.pill.role::before,.pill.plain::before{display:none}
.pill.plain{background:var(--surface-3);color:var(--ink-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{margin:0;font-size:14.5px;font-weight:700}
.panel-h .hint{margin-left:auto}
.panel-b{padding:16px 18px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3);font-size:13px}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.req::after{content:" *";color:var(--danger)}
.in{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0}
textarea.in{height:auto;padding:10px 12px;resize:vertical;line-height:1.65}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in[readonly],.in:disabled{background:var(--surface-2);color:var(--ink-2)}
.in.err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.hint{font-size:12px;color:var(--ink-3)}
.warn{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--mark-ink);background:var(--mark-soft);padding:8px 10px;border-radius:8px}
.warn svg.i{width:16px;height:16px;margin-top:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 홈 ── */
.hgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.today{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.today .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.today .eyebrow{font:600 11px var(--mono);letter-spacing:.08em;color:var(--ink-3)}
.today h2{margin:3px 0 0;font-size:18px;line-height:1.35;text-wrap:balance}
.today .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:13px}
.today .meta span{display:inline-flex;align-items:center;gap:5px}
.today .meta svg.i{width:15px;height:15px;color:var(--ink-3)}
.ruler{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.ruler i{height:26px;border-radius:4px;background:var(--surface-3);position:relative}
.ruler i.on{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.ruler i.now{outline:2px solid var(--mark);outline-offset:1px}
.ruler-l{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;font:500 10.5px var(--mono);color:var(--ink-3);margin-top:4px}
.nowline{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.nowline .mono{font-size:12px;color:var(--mark-ink);font-weight:600;white-space:nowrap}
.today .acts{display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.mini{display:flex;flex-direction:column}
.mini .it{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.mini .it:first-child{border-top:0}
.mini .it:hover{background:var(--surface-2)}
.mini .it .tx{min-width:0;flex:1}
.mini .it .tx b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .it .tx span{font-size:12px;color:var(--ink-3)}
.mini .it img{width:44px;height:33px;border-radius:5px;object-fit:cover;flex:none}
.team .it{cursor:default}
.team .it:hover{background:none}

/* ── 목록 ── */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .sp{flex:1}
select.in{height:34px;padding:0 30px 0 10px;width:auto;font-size:13px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search .in{height:36px;padding-left:34px}
.search svg.i{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--ink-3)}
.rhead,.rrow{display:grid;grid-template-columns:132px minmax(0,1fr) 88px 100px 150px;grid-template-areas:"d main au st snd";gap:14px;align-items:center;padding:12px 18px}
.rlist.noau .rhead,.rlist.noau .rrow{grid-template-columns:132px minmax(0,1fr) 100px 150px;grid-template-areas:"d main st snd"}
.rlist.noau .au{display:none}
.rhead{font-size:12px;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--line);padding-block:9px}
.rrow{border:0;border-top:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%;color:inherit}
.rhead+.rrow{border-top:0}
.rrow:hover{background:var(--surface-2)}
.rrow .d{grid-area:d;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.rrow .main-c,.rhead .main-c{grid-area:main;min-width:0}
.rrow .pl{font-weight:600;display:block}
.rrow .tk{color:var(--ink-2);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .au,.rhead .au{grid-area:au;font-size:13px}
.rrow .st,.rhead .st{grid-area:st}
.rrow .snd,.rhead .snd{grid-area:snd;font-size:12px;color:var(--ink-3)}
.rhead .d{grid-area:d}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mcard{padding:16px 18px;display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.mcard:hover{border-color:var(--accent)}
.mcard .when{font:500 12px var(--mono);color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.mcard h3{margin:0;font-size:15.5px;line-height:1.4;text-wrap:balance}
.mcard .pl{font-size:12.5px;color:var(--ink-2);display:flex;gap:5px;align-items:center}
.mcard .pl svg.i{width:14px;height:14px;color:var(--ink-3)}
.mcard .ex{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.mcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.thumbs{display:flex;gap:5px}
.thumbs img{width:52px;height:39px;border-radius:5px;object-fit:cover}
.thumbs .more{width:52px;height:39px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;font:600 12px var(--mono);color:var(--ink-2)}
.people{display:flex;flex-wrap:wrap;gap:4px}
.people span{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.todoc{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.todoc svg.i{width:14px;height:14px}

/* ── 보고서 작성 ── */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.pane-form{display:flex;flex-direction:column;gap:22px;min-width:0}
.pane-prev{position:sticky;top:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.pane-prev .cap{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eseg{display:none}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:15px;font-weight:700}
.sec-h .hint{font-family:var(--mono)}
.slots{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.slot{display:grid;grid-template-columns:118px minmax(0,1fr);border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .t{font:500 12px/1 var(--mono);color:var(--ink-2);background:var(--surface-2);display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-right:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.slot input{border:0;background:transparent;height:38px;padding:0 12px;min-width:0;width:100%}
.slot input:focus{outline:none;background:var(--accent-soft)}
.slot input:disabled{color:var(--ink-2)}
.slot.now .t{color:var(--accent-ink);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--mark)}
.slot.now .t::after{content:"지금";margin-left:auto;font:700 10.5px var(--sans);color:var(--mark-ink)}
.saved{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.saved.ing::before{background:var(--mark)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;background:var(--ok-soft);color:var(--ok)}
.banner.dirty{background:var(--mark-soft);color:var(--mark-ink)}
.banner.ro{background:var(--surface-3);color:var(--ink-2)}
.banner svg.i{width:17px;height:17px;margin-top:1px}
.banner b{font-weight:700}
.sticky-act{display:none}
.sends .it{display:grid;grid-template-columns:110px 22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 18px;border-top:1px solid var(--line);font-size:13px}
.sends .it:first-child{border-top:0}
.sends .it .mono{font-size:12px;color:var(--ink-3)}
.sends .it svg.i{width:16px;height:16px;color:var(--ink-3)}
.sends .it .ad{color:var(--ink-3);font-size:12px}

/* A4 — 종이이므로 테마와 무관하게 흰 바탕 */
.a4wrap{position:relative;width:100%;overflow:hidden}
.a4{position:absolute;top:0;left:0;transform-origin:0 0;width:794px;height:1123px;background:#FFFFFF;color:#111111;padding:40pt 36pt;font-family:'뫼비우스','Mobius','IBM Plex Sans KR','Malgun Gothic',sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.14),0 12px 30px rgba(0,0,0,.14);line-height:1.35}
.a4 .ttl{height:33pt;display:flex;align-items:center;justify-content:center;font-size:26pt;line-height:1;text-decoration:underline;text-underline-offset:6pt;text-decoration-thickness:1pt}
.a4 .gap{height:13.8pt}
.a4 .sh{height:27.6pt;display:flex;align-items:flex-end;padding:0 0 4pt;font-size:11pt;font-weight:700}
.a4 .sh.b{height:28.2pt}
.a4 table{width:100%;border-collapse:collapse;table-layout:fixed}
.a4 th,.a4 td{border:.75pt solid #000;padding:0 5pt;font-weight:400;overflow:hidden}
.a4 th{background:#F2F2F2;text-align:center;font-size:10pt;color:#111}
.a4 td{font-size:10.5pt;text-align:left}
.a4 .r1 th,.a4 .r1 td{height:22.2pt}
.a4 .r1 td{text-align:center}
.a4 .r1 td.l{text-align:left}
.a4 .rs th,.a4 .rs td{height:17.4pt}
.a4 .rs th{font-size:9pt}
.a4 .rs td .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a4 .rb th{height:222pt;font-size:11pt}
.a4 .rb td,.a4 .re td{vertical-align:top;padding:6pt 7pt}
.a4 .clip{overflow:hidden;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;line-height:1.55}
.a4 .rb .clip{height:209pt}
.a4 .re th{height:78pt;white-space:pre-line;font-size:10pt;line-height:1.4}
.a4 .re .clip{height:65pt;font-size:10pt}
.a4 .clip.over{box-shadow:inset 0 -2pt 0 #C98A12}

/* ── 메모 작성 ── */
.medit{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.medit .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.ttl-in{font-size:20px;font-weight:700;height:48px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:5px 6px;border:1px solid var(--line-2);border-radius:8px;min-height:40px;background:var(--surface);align-items:center}
.chips:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 10px;border-radius:999px;background:var(--surface-3);font-size:12.5px}

function dbMsg(error){
  if (!error) return '';
  const c = error.code || '', m = error.message || '';
  if (c === '23505') return '이미 목록에 있어요';
  if (c === '23514') return '형식을 확인하세요';
  if (c === '42501' || /row-level security|permission denied/i.test(m)) return '권한이 없습니다';
  if (/JWT|jwt expired/i.test(m)) return '로그인이 만료되었습니다. 다시 로그인하세요';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '인터넷 연결을 확인하세요';
  return m || '처리하지 못했습니다';
}
async function fn(action, body={}){
  const { data, error } = await sb.functions.invoke('admin-users', { body: Object.assign({ action }, body) });
  if (error){
    let msg = error.message || '';
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){}
    if (/Failed to send a request|Failed to fetch/i.test(msg)) msg = '서버 함수(admin-users)에 연결하지 못했습니다. 배포됐는지 확인하세요';
    if (/not found|404/i.test(msg)) msg = '서버 함수(admin-users)가 아직 배포되지 않았습니다';
    throw new Error(msg);
  }
  if (!data || !data.ok) throw new Error((data && data.error) || '처리하지 못했습니다');
  return data;
}
let busyN = 0;
async function busy(p){ busyN++; $('#busy').hidden = false; try { return await p; } finally { if (--busyN <= 0){ busyN = 0; $('#busy').hidden = true; } } }
async function lockBtn(btn, label, work){
  const old = btn ? btn.innerHTML : ''; if (btn){ btn.disabled = true; btn.textContent = label; }
  try { return await busy(work()); }
  finally { if (btn && btn.isConnected){ btn.disabled = false; btn.innerHTML = old; } }
}

async function boot(){
  if (!configured){ S.screen = 'setup'; return render(); }
  if (!sb){ S.screen = 'setup'; S.err = 'Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'; return render(); }
  const { data } = await sb.auth.getSession();
  if (!data.session){ S.screen = 'login'; return render(); }
  S.email = data.session.user.email || '';
  await afterPassword();
}
async function afterPassword(){
  const { data: lv, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error){ return toLogin(dbMsg(error)); }
  if (lv.currentLevel === 'aal2') return loadMe();
  const { data: fl, error: fe } = await sb.auth.mfa.listFactors();
  if (fe) return toLogin(dbMsg(fe));
  const verified = (fl.totp || []).filter(f => f.status === 'verified');
  if (verified.length){ S.factorId = verified[0].id; S.screen = 'otp'; S.err = ''; return render(); }
  return startEnroll(false);
}
async function startEnroll(isRe){
  try {
    const { data: fl } = await sb.auth.mfa.listFactors();
    for (const f of (fl && fl.all || []).filter(f => f.factor_type === 'totp' && f.status !== 'verified')) await sb.auth.mfa.unenroll({ factorId: f.id });
    const { data, error } = await sb.auth.mfa.enroll({ factorType:'totp', friendlyName:'note ' + new Date().toISOString().slice(0,16).replace('T',' ') });
    if (error) throw error;
    const en = { id:data.id, qr:data.totp.qr_code, secret:data.totp.secret };
    if (isRe){ S.reEnroll = en; render(); setTimeout(() => { const c = $('#re-code'); if (c) c.focus(); }, 30); }
    else { S.enroll = en; S.screen = 'enroll'; S.err = ''; render(); }
  } catch(e){
    if (isRe) toast('등록을 시작하지 못했습니다: ' + dbMsg(e));
    else toLogin('인증 앱 등록을 시작하지 못했습니다: ' + dbMsg(e));
  }
}
async function loadMe(){
  const { data: u } = await sb.auth.getUser();
  if (!u || !u.user) return toLogin('로그인이 만료되었습니다');
  S.email = u.user.email || '';
  const { data, error } = await sb.from('profiles').select('*').eq('id', u.user.id).maybeSingle();
  if (error || !data){ S.screen = 'noprofile'; S.err = error ? dbMsg(error) : ''; return render(); }
  S.me = data;
  if (data.must_change_pw){ S.screen = 'forcepw'; S.err = ''; return render(); }
  S.screen = 'app'; render();
  preload();
}

const REP_COLS = 'id,author,author_name,author_dept,author_title,report_date,place,main_task,attendees,schedule,body,etc,status,sent_at,created_at,updated_at';

async function loadReports(){
  const { data, error } = await sb.from('reports').select(REP_COLS)
    .order('report_date', { ascending:false }).order('created_at', { ascending:false }).limit(400);
  if (error){ toast(dbMsg(error)); if (!S.reports) S.reports = []; return; }
  S.reports = (data || []).map(fixRep);
}
function fixRep(r){
  let s = r.schedule;
  if (!Array.isArray(s)) s = emptySched();
  if (s.length !== 14) s = emptySched().map((_,i) => String(s[i] ?? ''));
  return Object.assign({}, r, { schedule: s.map(x => String(x ?? '')) });
}
const repById = id => (S.reports || []).find(r => r.id === id);
const repMine = r => !!r && r.author === S.me.id;
const authorOf = r => `${r.author_name || ''} ${r.author_title || ''}`.trim() || '(이름 없음)';

function newReport(date){
  const u = S.me;
  return { id:null, author:u.id, author_name:u.name || '', author_dept:u.dept || '', author_title:u.title || '',
    report_date: date || TODAY(), place:'', main_task:'', attendees:'',
    schedule: emptySched(), body:'', etc:'', status:'draft', sent_at:null };
}

function repPayload(r){
  return { report_date:r.report_date, place:(r.place||'').trim(), main_task:(r.main_task||'').trim(),
    attendees:(r.attendees||'').trim(), schedule:r.schedule.map(x => String(x||'').slice(0,120)),
    body:r.body || '', etc:r.etc || '' };
}

let saveT = null, saving = false, savePend = false;
function markSaving(txt){ S.saved = txt; const el = $('#saved'); if (el) el.textContent = txt; }
function queueSave(){
  markSaving('저장할 내용이 있어요');
  clearTimeout(saveT);
  saveT = setTimeout(() => { saveReport().catch(e => toast(e.message || String(e))); }, 1200);
}
async function saveReport(){
  const r = S.rcur;
  if (!r || !repMine(r)) return null;
  if (saving){ savePend = true; return null; }
  if (!r.report_date){ markSaving('일자를 정해 주세요'); return null; }
  saving = true; markSaving('저장 중…');
  try {
    const row = repPayload(r);
    let out;
    if (r.id){
      if (r.status === 'sent') row.status = 'edited';
      const { data, error } = await sb.from('reports').update(row).eq('id', r.id).select(REP_COLS).maybeSingle();
      if (error) throw new Error(dbMsg(error));
      if (!data) throw new Error('저장하지 못했습니다. 다시 로그인해 주세요');
      out = fixRep(data);
    } else {
      Object.assign(row, { author:S.me.id, author_name:S.me.name || '', author_dept:S.me.dept || '', author_title:S.me.title || '' });
      const { data, error } = await sb.from('reports').insert(row).select(REP_COLS).maybeSingle();
      if (error) throw new Error(dbMsg(error));
      if (!data) throw new Error('저장하지 못했습니다. 다시 로그인해 주세요');
      out = fixRep(data);
      r.id = out.id; S.rid = out.id;
    }
    r.status = out.status; r.sent_at = out.sent_at; r.updated_at = out.updated_at;
    const i = (S.reports || []).findIndex(x => x.id === out.id);
    if (i >= 0) S.reports[i] = Object.assign({}, out, repPayload(r));
    else if (S.reports) S.reports.unshift(Object.assign({}, out, repPayload(r)));
    markSaving('저장됨 ' + fmtDT(new Date().toISOString()));
    return out;
  } finally {
    saving = false;
    if (savePend){ savePend = false; queueSave(); }
  }
}
async function flushSave(){ clearTimeout(saveT); if (S.rcur && repMine(S.rcur)) await saveReport(); }

  if (r.status === 'edited') return `<span class="pill draft">보고 후 수정됨</span>`;
  return `<span class="pill draft">작성 중</span>`;

}

/* ───────── 토스트 ───────── */
let tT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => t.hidden = true, 3200); }

/* ───────── 동작 ───────── */
async function openSettingsTab(tab){
  S.stab = tab; S.reEnroll = null; render();
  if (tab === 'mfa'){ const { data } = await sb.auth.mfa.listFactors(); S.factors = (data && data.totp || []).filter(f => f.status === 'verified'); if (S.stab === 'mfa') render(); }
  if (tab === 'accounts' && isAdmin()){ await busy(loadUsers()); if (S.stab === 'accounts') render(); }
  if (tab === 'mail' || tab === 'sms'){ await busy(Promise.all([loadRcpt(tab), loadSettings()])); if (S.stab === tab) render(); }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'ovBg'){ if (e.target === t) closeOv(); return; }
  try {
    switch (a){
      case 'go': {
        await flushSave();
        S.route = t.dataset.to; closeOv();
        if (S.route !== 'report'){ S.rcur = null; S.rid = null; S.saved = ''; }
        if (S.route === 'settings') await openSettingsTab(t.dataset.tab || S.stab);
        else if (S.route === 'reports'){ render(); await busy(loadReports()); if (S.route === 'reports') render(); }
        else render();
        { const m = $('#main'); if (m) m.scrollTop = 0; } break; }
      case 'repNew': {
        const d = t.dataset.date || TODAY();
        const has = (S.reports || []).find(r => r.author === S.me.id && r.report_date === d);
        if (has){ openReport(has.id); toast(`${fmtMD(d)} 보고서를 이어서 씁니다`); break; }
        S.rcur = newReport(d); S.rid = null; S.route = 'report'; S.pane = 'form'; S.saved = '';
        render(); afterRepRender(); break; }
      case 'repOpen': openReport(t.dataset.id); break;
      case 'repPrint': window.print(); break;
      case 'repSend': toast('보고하기(메일 PDF · 문자)는 4단계에서 열립니다'); break;
      case 'repDel': {
        if (!armed(t, '정말 삭제')) break;
        const r = S.rcur; if (!r) break;
        clearTimeout(saveT);
        if (r.id){
          const { data, error } = await busy(sb.from('reports').delete().eq('id', r.id).select('id'));
          if (error || !data || !data.length) throw new Error(error ? dbMsg(error) : '삭제하지 못했습니다');
          S.reports = (S.reports || []).filter(x => x.id !== r.id);
        }
        S.rcur = null; S.rid = null; S.route = 'reports'; render(); toast('보고서를 삭제했어요'); break; }
      case 'pane': {
        S.pane = t.dataset.v;
        const ed = $('.editor');
        if (ed){ ed.dataset.pane = S.pane; $$('.eseg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.pane)); refreshPreview(); $('#main').scrollTop = 0; }
        break; }
      case 'rFilter': S.f[t.dataset.k] = t.dataset.v; render(); break;
      case 'logout': await logout(); break;
      case 'stab': await openSettingsTab(t.dataset.v); break;
      case 'closeOv': closeOv(); break;
      case 'mfaStart': await busy(startEnroll(true)); break;
      case 'mfaCancel': if (S.reEnroll){ await sb.auth.mfa.unenroll({ factorId:S.reEnroll.id }).catch(() => null); } S.reEnroll = null; render(); break;
      case 'acctNew': openOv(dlg('계정 추가', acctForm(null), `<button class="btn" data-act="closeOv">취소</button><button class="btn primary" type="submit" form="acct-form">계정 만들기</button>`)); break;
      case 'acctEdit': { const u = (S.users||[]).find(x => x.id === t.dataset.id); if (u) openOv(dlg(`${u.name} ${u.title} 계정`, acctForm(u), `<button class="btn" data-act="closeOv">취소</button><button class="btn primary" type="submit" form="acct-form">저장</button>`)); break; }
      case 'aRole': { const g = $('#a-role'); g.dataset.v = t.dataset.v; $$('button', g).forEach(b => b.setAttribute('aria-pressed', b === t)); break; }
      case 'acctResetPw': {
        if (!armed(t, '정말 초기화')) break;
        const u = S.users.find(x => x.id === t.dataset.id);
        const r = await lockBtn(t, '초기화 중…', () => fn('reset_password', { id:u.id }));
        await loadUsers(); render(); showTemp('비밀번호를 초기화했어요', u.name, u.login_id, r.temp_password); break; }
      case 'acctResetMfa': {
        if (!armed(t, '정말 초기화')) break;
        const u = S.users.find(x => x.id === t.dataset.id);
        await lockBtn(t, '초기화 중…', () => fn('reset_mfa', { id:u.id }));
        await loadUsers(); closeOv(); render(); toast(`${u.name}님의 인증 앱 등록을 지웠어요. 다음 로그인 때 새로 등록합니다`); break; }
      case 'acctActive': {
        const on = t.dataset.v === '1';
        if (!on && !armed(t, '정말 사용중지')) break;
        const u = S.users.find(x => x.id === t.dataset.id);
        await lockBtn(t, '바꾸는 중…', () => fn('set_active', { id:u.id, active:on }));
        await loadUsers(); closeOv(); render(); toast(on ? `${u.name} 계정을 다시 쓸 수 있어요` : `${u.name} 계정을 사용중지했어요 — 1시간 안에 모든 기기에서 끊깁니다`); break; }
      case 'copyTemp': { try { await navigator.clipboard.writeText(t.dataset.t); toast('복사했어요'); } catch(err){ const r = document.createRange(); r.selectNodeContents($('#tmp-pw')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('임시 비밀번호를 선택했어요 — 복사해 주세요'); } break; }
      case 'rcDef': {
        if (!isAdmin()) break;
        const kind = t.dataset.kind, tb = kind === 'mail' ? 'mail_recipients' : 'sms_recipients';
        const x = S[kind].find(y => y.id === t.dataset.id); const v = !x.is_default;
        const { data, error } = await busy(sb.from(tb).update({ is_default:v }).eq('id', x.id).select());
        if (error || !data || !data.length) throw new Error(error ? dbMsg(error) : '권한이 없습니다');
        x.is_default = v; t.setAttribute('aria-checked', v); break; }
      case 'rcDel': {
        if (!armed(t, '정말 삭제')) break;
        const kind = t.dataset.kind, tb = kind === 'mail' ? 'mail_recipients' : 'sms_recipients';
        const { data, error } = await busy(sb.from(tb).delete().eq('id', t.dataset.id).select());
        if (error || !data || !data.length) throw new Error(error ? dbMsg(error) : '권한이 없습니다');
        await loadRcpt(kind); render(); toast('수신자를 삭제했어요'); break; }
    }
  } catch(err){ toast(err.message || String(err)); }
});
async function openReport(id){
  await flushSave();
  if (S.reports === null) await busy(loadReports());
  const r = repById(id);
  if (!r){ toast('보고서를 찾을 수 없습니다'); S.route = 'reports'; render(); return; }
  S.rcur = fixRep(r); S.rid = id; S.route = 'report'; S.pane = 'form'; S.saved = repMine(r) ? '자동 저장됩니다' : '';
  render(); afterRepRender();
  const m = $('#main'); if (m) m.scrollTop = 0;
}
function afterRepRender(){ fitA4(); measureA4(); autoGrow($('#r-body')); autoGrow($('#r-etc')); }
function autoGrow(el){ if (!el) return; el.style.height = 'auto'; el.style.height = Math.min(900, el.scrollHeight + 2) + 'px'; }

function armed(btn, label){
  if (btn.dataset.armed){ delete btn.dataset.armed; return true; }
  const old = btn.innerHTML; btn.dataset.armed = 1; btn.classList.add('danger','armed'); btn.textContent = label;
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove('armed'); btn.innerHTML = old; } }, 3500);
  return false;
}

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form, btn = f.querySelector('button[type=submit]') || $(`button[form="${f.id}"]`);
  const err = (id, m) => { const el = $('#'+id); if (el) el.textContent = m; };
  try {
    if (k === 'login'){
      const id = $('#lg-id').value.trim().toLowerCase(), pw = $('#lg-pw').value;
      if (!id || !pw) return err('lg-err', '아이디와 비밀번호를 입력하세요');
      if (!/^[a-z0-9]{3,20}$/.test(id)) return err('lg-err', '아이디는 영문 소문자·숫자입니다');
      await lockBtn(btn, '확인 중…', async () => {
        const { error } = await sb.auth.signInWithPassword({ email:`${id}@${DOMAIN}`, password:pw });
        if (error){
          const m = error.message || '';
          err('lg-err', /banned/i.test(m) ? '사용이 중지된 계정입니다. 관리자에게 문의하세요'
            : /rate|too many/i.test(m) ? '시도가 너무 많아요. 잠시 뒤 다시 해 주세요'
            : /Invalid login|invalid_credentials/i.test(m) ? '아이디 또는 비밀번호가 맞지 않습니다' : dbMsg(error));
          $('#lg-pw').value = ''; $('#lg-pw').focus(); return;
        }
        store.set('note-last-id', id); S.err = '';
        await afterPassword();
      });
    }
    if (k === 'otp'){
      const code = $$('.otp input').map(x => x.value).join('');
      if (!/^\d{6}$/.test(code)) return;
      await lockBtn(btn, '확인 중…', async () => {
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId:S.factorId, code });
        if (error){ err('otp-err', /invalid|expired/i.test(error.message||'') ? '숫자가 맞지 않아요. 앱에 표시된 지금 숫자를 입력하세요' : dbMsg(error)); $$('.otp input').forEach(x => x.value = ''); $('#otp0').focus(); $('#otp-ok').disabled = true; return; }
        await loadMe();
      });
    }
    if (k === 'enroll'){
      const code = $('#en-code').value.trim();
      if (!/^\d{6}$/.test(code)) return err('en-err', '앱에 표시된 6자리 숫자를 입력하세요');
      await lockBtn(btn, '확인 중…', async () => {
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId:S.enroll.id, code });
        if (error){ err('en-err', '숫자가 맞지 않아요. QR 을 다시 스캔했는지, 휴대폰 시간이 맞는지 확인하세요'); $('#en-code').select(); return; }
        S.enroll = null; await loadMe(); toast('인증 앱을 등록했어요. 다음 로그인부터 6자리를 묻습니다');
      });
    }
    if (k === 'reenroll'){
      const code = $('#re-code').value.trim();
      if (!/^\d{6}$/.test(code)) return err('re-err', '앱에 표시된 6자리 숫자를 입력하세요');
      await lockBtn(btn, '확인 중…', async () => {
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId:S.reEnroll.id, code });
        if (error) return err('re-err', '숫자가 맞지 않아요. 새 휴대폰으로 QR 을 스캔했는지 확인하세요');
        const newId = S.reEnroll.id; S.reEnroll = null;
        for (const old of S.factors.filter(x => x.id !== newId)) await sb.auth.mfa.unenroll({ factorId:old.id });
        const { data } = await sb.auth.mfa.listFactors(); S.factors = (data && data.totp || []).filter(x => x.status === 'verified');
        render(); toast('새 휴대폰으로 등록했어요. 예전 휴대폰의 숫자는 이제 쓸 수 없습니다');
      });
    }
    if (k === 'forcepw' || k === 'pw'){
      const p = k === 'forcepw' ? ['fp0','fp1','fp2','fp-err'] : ['pw0','pw1','pw2','pw-err'];
      const a = $('#'+p[0]).value, b = $('#'+p[1]).value, c = $('#'+p[2]).value;
      if (!a) return err(p[3], k === 'forcepw' ? '임시 비밀번호를 입력하세요' : '현재 비밀번호를 입력하세요');
      if (!pwOk(b)) return err(p[3], '새 비밀번호는 8자 이상, 영문과 숫자를 섞어 주세요');
      if (b !== c) return err(p[3], '새 비밀번호 두 칸이 서로 달라요');
      if (a === b) return err(p[3], '지금과 다른 비밀번호를 쓰세요');
      await lockBtn(btn, '바꾸는 중…', async () => {
        try { await fn('change_password', { current:a, next:b }); }
        catch(e2){ return err(p[3], e2.message); }
        if (k === 'forcepw'){ S.me.must_change_pw = false; S.screen = 'app'; render(); preload(); toast('비밀번호를 바꿨어요. 이제 note 를 쓸 수 있습니다'); }
        else { f.reset(); err(p[3], ''); toast('비밀번호를 바꿨어요. 다른 기기에서는 다시 로그인해야 합니다'); }
      });
    }
    if (k === 'phone'){
      const v = telNorm($('#me-phone').value);
      if (v === null) return toast('휴대폰 번호를 확인하세요 (예: 010-1234-5678)');
      await lockBtn(btn, '저장 중…', async () => {
        const { data, error } = await sb.from('profiles').update({ phone:v }).eq('id', S.me.id).select('phone');
        if (error || !data || !data.length) throw new Error(error ? dbMsg(error) : '저장하지 못했습니다');
        S.me.phone = v; $('#me-phone').value = v; toast('저장했어요');
      });
    }
    if (k === 'sender'){
      const v = $('#snd-name').value.trim();
      if (!v) return toast('보낸 사람 이름을 입력하세요');
      await lockBtn(btn, '저장 중…', async () => {
        const { data, error } = await sb.from('app_settings').update({ value:v, updated_by:S.me.id }).eq('key','sender_name').select();
        if (error || !data || !data.length) throw new Error(error ? dbMsg(error) : '권한이 없습니다');
        S.settings.sender_name = v; render(); toast('보낸 사람 이름을 저장했어요');
      });
    }
    if (k === 'add-mail' || k === 'add-sms'){
      const kind = k.slice(4), nm = $(`#${kind}-nm`).value.trim(), dp = $(`#${kind}-dp`).value.trim(); let ad = $(`#${kind}-ad`).value.trim();
      if (!nm) return err(`${kind}-err`, '이름을 입력하세요');
      if (kind === 'mail'){ ad = ad.toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ad)) return err(`${kind}-err`, '이메일 주소 형식을 확인하세요 (예: name@company.co.kr)'); }
      else { ad = telNorm(ad); if (!ad) return err(`${kind}-err`, '휴대폰 번호를 확인하세요 (예: 010-1234-5678)'); }
      await lockBtn(btn, '추가 중…', async () => {
        const row = kind === 'mail' ? { name:nm, dept:dp, email:ad } : { name:nm, dept:dp, phone:ad };
        const { error } = await sb.from(kind === 'mail' ? 'mail_recipients' : 'sms_recipients').insert(row);
        if (error) return err(`${kind}-err`, error.code === '23505' ? '이미 목록에 있는 주소예요' : dbMsg(error));
        await loadRcpt(kind); render(); toast(`${nm}님을 추가했어요`);
      });
    }
    if (k === 'acct'){
      const id = f.dataset.id, v = n => $('#a-'+n).value.trim();
      const role = $('#a-role').dataset.v === 'admin' ? 'admin' : 'member';
      if (!v('name')) return err('a-err', '이름을 입력하세요');
      const ph = telNorm(v('phone')); if (ph === null) return err('a-err', '휴대폰 번호를 확인하세요 (예: 010-1234-5678)');
      const body = { name:v('name'), dept:v('dept'), title:v('title'), phone:ph, role };
      if (!id){
        const login = v('login').toLowerCase();
        if (!/^[a-z0-9]{3,20}$/.test(login)) return err('a-err', '아이디는 영문 소문자·숫자 3~20자로 입력하세요');
        await lockBtn(btn, '만드는 중…', async () => {
          let r; try { r = await fn('create', Object.assign({ login_id:login }, body)); } catch(e2){ return err('a-err', e2.message); }
          await loadUsers(); render(); showTemp('계정을 만들었어요', body.name, login, r.temp_password);
        });
      } else {
        await lockBtn(btn, '저장 중…', async () => {
          try { await fn('update', Object.assign({ id }, body)); } catch(e2){ return err('a-err', e2.message); }
          if (id === S.me.id){ Object.assign(S.me, body); }
          await loadUsers(); closeOv(); render(); toast('저장했어요');
        });
      }
    }
  } catch(ex){ toast(ex.message || String(ex)); }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.filter){ S.f[t.dataset.filter] = t.value; render(); }
});

let prevT = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.rf && S.rcur && repMine(S.rcur)){
    const k = t.dataset.rf;
    if (k[0] === 's' && /^s\d+$/.test(k)) S.rcur.schedule[+k.slice(1)] = t.value;
    else S.rcur[k] = t.value;
    if (k === 'body' || k === 'etc') autoGrow(t);
    if (k[0] === 's' && /^s\d+$/.test(k)){ const el = $('#filled'); if (el) el.textContent = `${S.rcur.schedule.filter(x => x.trim()).length}/14칸`; }
    clearTimeout(prevT); prevT = setTimeout(refreshPreview, 120);
    queueSave();
    return;
  }
  if (t.matches('.otp input')){
    t.value = t.value.replace(/\D/g,'').slice(-1);
    const i = +t.id.slice(3); if (t.value && i < 5) $('#otp'+(i+1)).focus();
    const all = $$('.otp input').every(x => x.value);
    $('#otp-ok').disabled = !all;
    if (all) $('#otp-ok').click();
  }
  if (t.id === 'en-code' || t.id === 're-code') t.value = t.value.replace(/\D/g,'').slice(0,6);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('.otp input') && e.key === 'Backspace' && !t.value){ const i = +t.id.slice(3); if (i > 0){ const p = $('#otp'+(i-1)); p.value = ''; p.focus(); } }
  if (e.key === 'Escape' && $('#ov').innerHTML) closeOv();
});
document.addEventListener('paste', e => {
  const t = e.target; if (!t.matches('.otp input')) return;
  const d = (e.clipboardData.getData('text') || '').replace(/\D/g,'').slice(0,6); if (!d) return;
  e.preventDefault(); d.split('').forEach((c,i) => { const x = $('#otp'+i); if (x) x.value = c; });
  $('#otp-ok').disabled = d.length < 6; if (d.length === 6) $('#otp-ok').click();
});

try { new ResizeObserver(() => fitA4()).observe($('#app')); } catch(e){}
addEventListener('beforeunload', e => {
  if (S.rcur && repMine(S.rcur) && (saving || savePend || /저장할 내용/.test(S.saved || ''))){ e.preventDefault(); e.returnValue = ''; }
});
addEventListener('pagehide', () => { try { flushSave(); } catch(e){} });

if (sb){
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.screen !== 'login') toLogin('로그아웃되었습니다. 다시 로그인하세요'); });
}
render();
boot().catch(e => toLogin(dbMsg(e)));
})();


</script>
